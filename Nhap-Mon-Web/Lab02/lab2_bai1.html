<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<link rel="icon" href="./Vi_du_Lab01/images/layout/book.png" type="image/png">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>BookStore</title>
</head>

<body>
    <table width="1000" align="center" border="1" cellpadding="0" cellspacing="0">

        <tr>
            <!-- logo và banner -->
            <td>
                <table border="1" style="border:3px solid #b2b2cc;" cellpadding="0" cellspacing="0" width="100%"
                    color="#b2b2cc">
                    <tr>
                        <td style="background-color: rgba(255, 99, 71, 0.5);" height="173" width="300" align="center"
                            valign="middle">
                            Logo
                        </td>
                        <td style="background-color: rgba(11, 191, 188, 0.5);" width="700" align="center">
                            Banner
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <!-- menu -->
            <td height="70">
                <!-- Tạo 1 table 5 cột, 1 hàng định dạng phù hợp theo yêu cầu -->
                <table border="1" style="border:3px solid #b2b2cc;" align="center" width="100%" height="100%">
                    <tr>
                        <td align="center"><strong>1</strong></td>
                        <td align="center"><strong>2</strong></td>
                        <td align="center"><strong>3</strong></td>
                        <td align="center"><strong>4</strong></td>
                        <td align="center"><strong>5</strong></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <!-- dòng trắng -->
            <td height="10"></td>
        </tr>
        <tr>
            <!-- Nội dung -->
            <td>
                <table width="100%" border="0" cellpadding="0" cellspacing="0">
                    <tr>
                        <!-- left -->
                        <td width="196" height="250" valign="top" align="center" align-content="center">
                            <table style="background-color: rgba(52, 202, 117, 0.5); border:3px solid #b2b2cc;">
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 1
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 2
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 3
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 4
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 5
                                    </td>
                                </tr>
                            </table>
                        </td>
                        <!-- Tạo 1 table 5 hàng, 1 cột định dạng phù hợp -->

                        <td width="24" style="border:3px solid #b2b2cc;" height="70" width="200" align="center"></td>
                        <!-- trắng -->

                        <!-- center -->
                        <td width="560" align="center">Content</td>

                        <td width="24" style="border:3px solid #b2b2cc;" height="70" width="200" align="center"></td>
                        <!-- trắng -->

                        <!-- right -->
                        <td width="196" valign="top" align="center">
                            <!-- Tạo 1 table 5 hàng, 1 cột tương ứng bên left-->
                            <table style="background-color: rgba(52, 202, 117, 0.5); border:3px solid #b2b2cc;">
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 1
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 2
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 3
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 4
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="border:3px solid #b2b2cc;" width="196" height="50"> 5
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>

        <tr>
            <!-- trắng -->
            <td height="10"></td>
        </tr>

        <tr>
            <!-- footer -->
            <td height="60" align="center" style="border:3px solid #b2b2cc;"> Footer </td>
        </tr>

    </table>

</body>

</html>
